name: cohort-devsecops
services:
  sonar-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: local-lab-only
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 3s
      retries: 20
  sonarqube:
    image: sonarqube:26.11.0.134175-community
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: local-lab-only
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
  nexus:
    image: sonatype/nexus3:3.94.0
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - nexus_data:/nexus-data
  builder:
    image: maven:3.9.11-eclipse-temurin-21
    profiles: ["tools"]
    working_dir: /workspace
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
    volumes:
      - ./app:/workspace
      - maven_cache:/root/.m2
volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  nexus_data:
  maven_cache:
